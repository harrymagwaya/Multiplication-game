<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form class="form" id="form">
        <h4 class="score" id="score">score: 0</h4>
        <h1 id="question">What is 1 multiplied by 1?</h1>
        <!--auto focus allows the orm to keep on suggesting new input requred// . -->
        <!--auto complete removed capability for user to see suggstions bases on previous history-->
        <input type="text" class="input" id="input"  placeholder="Enter your answer" autofocus autocomplete="off">
        <button type="submit" class="btn">Submit</button>
      <!--  <button type="newGame" class="btn">New Game</button> -->
    </form>
    <script src="index.js"></script>
</body>
</html>
